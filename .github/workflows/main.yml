name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux
          - os: windows-latest
            suffix: windows
          - os: macos-latest
            suffix: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests

      - name: Build executables
        shell: bash
        run: |
          sep=":"; [ "${{ runner.os }}" = "Windows" ] && sep=";"
          # macOS .app bundles must be onedir (onefile + windowed is deprecated and errors in PyInstaller 7)
          mode="--onefile"; [ "${{ runner.os }}" = "macOS" ] && mode="--onedir"
          pyinstaller app.py $mode --windowed --name coaro_decrypt \
            --icon assets/icon.png --add-data "assets/icon.png${sep}assets"
          pyinstaller minimal.py --onefile --name coaro_decrypt-cli

          mkdir release
          suffix="${{ matrix.suffix }}"
          case "${{ runner.os }}" in
            Windows)
              cp dist/coaro_decrypt.exe "release/coaro_decrypt-${suffix}.exe"
              cp dist/coaro_decrypt-cli.exe "release/coaro_decrypt-cli-${suffix}.exe"
              ;;
            macOS)
              (cd dist && zip -qry "../release/coaro_decrypt-${suffix}.app.zip" coaro_decrypt.app)
              cp dist/coaro_decrypt-cli "release/coaro_decrypt-cli-${suffix}"
              ;;
            *)
              cp dist/coaro_decrypt "release/coaro_decrypt-${suffix}"
              cp dist/coaro_decrypt-cli "release/coaro_decrypt-cli-${suffix}"
              ;;
          esac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coaro_decrypt-${{ matrix.suffix }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
